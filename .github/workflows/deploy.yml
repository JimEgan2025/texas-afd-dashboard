name: Deploy Texas AFD Dashboard

on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - 'generate-report.js'
      - 'package.json'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run build  # Assumes your build script outputs to /dist or similar
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist  # Adjust to your output dir

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
